<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F5EF" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("brand_voice_theme");
          // Light theme is the default when no preference has been explicitly saved
          var theme = stored === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            if (meta) meta.setAttribute("content", "#161715");
          } else {
            document.documentElement.classList.remove("dark");
            if (meta) meta.setAttribute("content", "#F7F5EF");
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="A considered brand voice studio for turning what makes your brand distinctive into campaign-ready ideas."
    />
    <meta property="og:title" content="Brand Voice AI — Find the voice. Make it matter." />
    <meta
      property="og:description"
      content="Turn what makes a brand distinctive into 10 ideas worth posting."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>Brand Voice AI — Find the voice. Make it matter.</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
